# Pre-commit hooks — catch what CI checks, but locally before you push.
# Mirrors the CI gates (ruff, gitleaks) plus cheap file hygiene, so the
# feedback loop is seconds instead of a red build minutes later.
#
# Setup (one time):
#   pip install pre-commit && pre-commit install
# Run against everything on demand:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff            # lint (same ruff.toml as CI)
        args: [--fix]
        files: ^(app|scripts|tests)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks        # secret scan (same .gitleaks.toml as CI)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements   # catches a stray breakpoint()/pdb before it ships
