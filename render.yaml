# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Stands up the whole stack: managed Postgres, a Redis/Valkey key-value store
# for the rate limiter, the FastAPI backend, and the static frontend. Apply it
# from the Render dashboard (New → Blueprint) or `render blueprint launch`.
#
# Secrets marked `sync: false` are NOT in this file (kept out of VCS) — Render
# prompts for them on first apply. See docs/runbooks/first-deploy.md for the
# full walkthrough.
#
# Plans default to `free` so you can stand it up at zero cost. Free tiers have
# real limits — the API sleeps after inactivity and free Postgres EXPIRES after
# 30 days. Upgrade both before a pilot; the comments mark where.

databases:
  - name: dealsignal-db
    plan: starter         # Paid tier — required for pilot (free Postgres expires in 30 days)
    postgresMajorVersion: "16"

services:
  # ── Redis / Valkey — shared-state rate limiter ─────────────────────────────
  # Without this the limiter falls back to per-process buckets (each worker
  # counts separately). With it, limits are enforced across every instance.
  - type: keyvalue
    name: dealsignal-redis
    plan: starter         # Shared rate-limiter state across API instances
    # Rate-limit keys all carry an EXPIRE, so evicting the least-recently-used
    # under memory pressure is safe.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []       # empty = internal-only; not reachable from the internet

  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: dealsignal-api
    runtime: python
    plan: starter         # No sleep-on-idle; required for production pilot
    buildCommand: pip install -r requirements.txt
    # Runs once per deploy, before traffic cuts over. Applies pending Alembic
    # migrations (incl. RLS from migration 003). A broken migration fails the
    # deploy, so it never ships. Seeding is NOT automatic — run `python seed.py`
    # once via `render shell` against a fresh DB if you want sample data.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production        # turns on the fail-fast config guards in app/config.py
      # Wired automatically from the managed services above.
      - key: DATABASE_URL
        fromDatabase:
          name: dealsignal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealsignal-redis
          property: connectionString
      # Generated once by Render and held in the service env — never in VCS.
      - key: SECRET_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true      # scrapers send `Authorization: Bearer <this>`
      # httpOnly refresh cookie must be Secure over HTTPS (Render terminates TLS).
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      # ── Set these in the dashboard on first apply (sync:false) ──
      # CORS_ALLOWED_ORIGINS: the frontend origin(s), comma-separated, no '*'.
      #   The app refuses to boot in production if this is empty or contains '*'.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # APP_BASE_URL: the frontend URL — used to build password-reset links.
      #   Defaults to localhost if unset, which would send broken reset emails.
      - key: APP_BASE_URL
        sync: false
      # RESEND_API_KEY: outbound email (password reset). Without it, reset
      #   emails are logged instead of sent.
      - key: RESEND_API_KEY
        sync: false
      # SENTRY_DSN: backend error tracking. Leave unset to disable Sentry.
      - key: SENTRY_DSN
        sync: false
      # NOTE: ALLOW_ANONYMOUS is intentionally NOT set here. Production forces
      # it false; the app refuses to start if you set it true.

  # ── Daily ingestion (permits + parcels) ────────────────────────────────────
  # Syncs catalog.json and runs all active sources. Separate from the web
  # service so long fetches don't contend with API request latency.
  # See docs/runbooks/ingestion-scheduling.md
  - type: cron
    name: dealsignal-ingestion
    runtime: python
    plan: starter
    schedule: "0 6 * * *"   # 06:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/daily-ingestion.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dealsignal-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealsignal-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INGESTION_ORGANIZATION
        value: default-org
      - key: INGESTION_MAX_PAGES_PER_SOURCE
        value: "10"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── Frontend (static site) ─────────────────────────────────────────────────
  - type: web
    name: dealsignal-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # VITE_* vars are baked into the bundle AT BUILD TIME. Changing one needs
      # a rebuild, not just a restart. Set these in the dashboard on first apply.
      # VITE_API_BASE_URL MUST point at the API service URL — without it the
      # frontend calls localhost and every request fails in production.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Security headers on the browser-executing surface. The backend's CSP
      # only covers API (JSON) responses; the static app had none. These five
      # are safe for any SPA and deliver most of the hardening.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # no-referrer also stops the password-reset ?token= leaking via Referer.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # Content-Security-Policy — validated with `npm run build` (Node 20).
      # If you use a custom API domain, add it to connect-src in the dashboard.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:; font-src 'self' data:;
          connect-src 'self' https://*.onrender.com https://*.ingest.sentry.io https://*.sentry.io;
          frame-ancestors 'none'; base-uri 'self'; object-src 'none'
    routes:
      # SPA fallback: every path serves index.html so client-side routing works.
      - type: rewrite
        source: /*
        destination: /index.html
