[pytest]
# The test suite signs JWTs with short throwaway secrets (e.g. SECRET_KEY=t).
# PyJWT >= 2.13 warns when an HMAC key is under the RFC 7518 32-byte minimum,
# which floods test output. Production is protected separately: app/config.py
# rejects any SECRET_KEY shorter than 32 chars when ENVIRONMENT=production, so
# silencing the warning here does not weaken the real guarantee.
filterwarnings =
    ignore::jwt.warnings.InsecureKeyLengthWarning
