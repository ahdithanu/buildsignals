name: e2e

# Browser-level Playwright tests. Kept SEPARATE from ci.yml because it's
# slow (boots two servers + a real browser) and shouldn't block every push.
#
# Pull requests run the real local browser workflows against isolated test data.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "e2e/**"
      - "scripts/verify_assessment_workflow.cjs"
      - "scripts/verify_browser_policy.cjs"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npm run e2e:install

      - name: Run E2E
        # The config's `webServer` boots both the FastAPI backend (:8000,
        # migrated throwaway DB, rate limits raised) and the Vite dev server
        # (:8080). No manual server startup needed here.
        run: npm run e2e

      - name: Check real-cookie session ordering
        run: node e2e/auth-cookie-races/reproduce.mjs --require-safe

      - name: Build frontend for browser policy verification
        env:
          VITE_API_BASE_URL: https://buildsignals-api.onrender.com
          VITE_SENTRY_DSN: ""
        run: npm run build

      - name: Verify strict browser policy and login download budget
        env:
          BROWSER_POLICY_ARTIFACT_DIR: playwright-report/browser-policy
        run: node scripts/verify_browser_policy.cjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
