name: e2e

# Browser-level Playwright tests. Kept SEPARATE from ci.yml because it's
# slow (boots two servers + a real browser) and shouldn't block every push.
#
# Trigger is manual-only (workflow_dispatch) until the specs are confirmed
# green on a real run — see e2e/README.md, they were authored but never
# executed. Once they pass, uncomment the pull_request trigger below to gate
# PRs on them.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Playwright config's webServer boots the backend with these; set
      # here too so anything the workflow runs directly sees consistent values.
      DATABASE_URL: "sqlite:///./e2e-test.db"
      SECRET_KEY: "e2e-ci-secret-key-not-for-production"
      ENVIRONMENT: "ci"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npm run e2e:install

      - name: Run E2E
        # The config's `webServer` boots both the FastAPI backend (:8000,
        # migrated throwaway DB, rate limits raised) and the Vite dev server
        # (:8080). No manual server startup needed here.
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
