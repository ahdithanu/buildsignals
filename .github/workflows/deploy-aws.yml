name: Deploy API to AWS

# Builds the API image, runs DB migrations as a one-off in-VPC ECS task, then
# tells App Runner to roll out the new image. Auth is via GitHub OIDC — no AWS
# keys are stored in the repo.
#
# TRIGGER: manual (workflow_dispatch) only, on purpose. The first run jumps the
# live database forward many migrations, so it should be a deliberate click, not
# an accidental push. Once you've run it once and are happy, enable continuous
# deploy by uncommenting the `push:` block below.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'app/**'
  #     - 'alembic/**'
  #     - 'requirements.txt'
  #     - 'Dockerfile'
  #     - 'docker-entrypoint.sh'
  #     - 'alembic.ini'
  #     - 'seed.py'

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 159667575905.dkr.ecr.us-east-1.amazonaws.com/dealsignal-api
  ECS_CLUSTER: dealsignal-cicd
  MIGRATE_TASKDEF: dealsignal-migrate
  APPRUNNER_ARN: arn:aws:apprunner:us-east-1:159667575905:service/dealsignal-api/1d89815a963b4a3cb37ca6b752048d16
  SUBNETS: subnet-0c8429050054303f3,subnet-0fa5022e747596511
  SECURITY_GROUP: sg-0730b1695dc68bc4e

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::159667575905:role/dealsignal-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="$ECR_REPO:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$ECR_REPO:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REPO:latest"
          echo "Pushed $IMAGE"

      - name: Run database migrations (one-off ECS Fargate task, in-VPC)
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TASKDEF" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration container exit code: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Migrations failed (exit $EXIT). Check CloudWatch log group /ecs/dealsignal-migrate."
            exit 1
          fi

      - name: Deploy to App Runner
        run: |
          set -euo pipefail
          OP=$(aws apprunner start-deployment --service-arn "$APPRUNNER_ARN" --query 'OperationId' --output text)
          echo "Started App Runner deployment: $OP"

      - name: Wait for App Runner to stabilize
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            ST=$(aws apprunner describe-service --service-arn "$APPRUNNER_ARN" --query 'Service.Status' --output text)
            echo "App Runner status: $ST"
            case "$ST" in
              RUNNING) echo "Deployment complete."; exit 0 ;;
              OPERATION_IN_PROGRESS) sleep 20 ;;
              *) echo "::error::Unexpected App Runner status: $ST"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for App Runner to stabilize."; exit 1
