name: security

# Run on every PR + push to main + once a week on a schedule so we catch
# CVEs published against pinned-and-merged dependencies.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 09:00 UTC. Weekly is enough — daily generates noise that
    # nobody triages.
    - cron: "0 9 * * 1"

jobs:
  python-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # --strict: fail the job if any vulnerability is found.
      # --ignore-vuln: list any GHSA IDs we've intentionally deferred here
      # with a comment + ticket link. Empty for now.
      - name: Audit requirements.txt
        run: pip-audit --strict --requirement requirements.txt

  node-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      # Production deps only — devDependencies (vitest, eslint, etc.) ship
      # nothing to users, so a CVE there is informational. `--audit-level=high`
      # means we only fail on high+critical; mediums get triaged but don't
      # block the line.
      - name: Audit production deps
        run: npm audit --omit=dev --audit-level=high
