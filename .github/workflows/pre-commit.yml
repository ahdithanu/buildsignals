name: pre-commit

# Runs pre-commit hooks in CI so contributors without local hooks installed
# still get ruff + gitleaks + file hygiene checks. Mirrors .pre-commit-config.yaml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run hooks
        run: pre-commit run --all-files
