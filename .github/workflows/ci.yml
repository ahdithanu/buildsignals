name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --platform linux/amd64 -t buildsignals-api-ci:${{ github.sha }} .
      - name: Import packaged API without network access
        run: >-
          docker run --rm --network none --entrypoint python
          -e ENVIRONMENT=test -e TESTING=1
          -e DATABASE_URL=sqlite:///:memory:
          -e SECRET_KEY=ci-image-import-not-a-production-secret
          -e OPENROUTER_API_KEY= -e REDIS_URL=
          buildsignals-api-ci:${{ github.sha }}
          -c 'import app.main; print("Packaged API import passed")'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ENVIRONMENT: "ci"
      OPENROUTER_API_KEY: ""
      REDIS_URL: ""
      # RLS + migration-reversibility tests run against real Postgres, as a
      # NON-superuser role. This matters: a superuser bypasses row-level
      # security even under FORCE RLS, so RLS assertions only mean something
      # as a non-superuser — exactly how the app connects in production.
      TEST_POSTGRES_URL: "postgresql+psycopg2://appuser:app@localhost:5432/dealsignal_test"
      TEST_EVAL_POSTGRES_URL: "postgresql+psycopg2://appuser:app@localhost:5432/dealsignal_test"
      TEST_SCHEMA_RECONCILIATION_POSTGRES_URL: "postgresql+psycopg2://appuser:app@localhost:5432/dealsignal_test"
    services:
      postgres:
        # Nearby-parcel migrations require PostGIS (geography centroid + GIST index).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pip-audit pytest-cov ruff

      # Lint: a focused ruleset (pyflakes + import order) — see ruff.toml.
      # Catches real bugs (undefined names, unused imports); this is how the
      # config.py use-before-definition bug was found.
      - name: Lint (ruff)
        run: ruff check app/ scripts/ tests/

      - name: Verify nationwide rollout manifest
        run: python -m app.services.ingestion.cli catalog rollout-manifest --check

      # Fails the build on any known-vulnerable dependency. Uses the PyPI
      # advisory DB (osv.dev). To skip a CVE we've reviewed and confirmed
      # doesn't affect us, add --ignore-vuln=<ID> with a comment.
      #
      # Zero suppressions. If this step fails, a dependency has a known
      # CVE — bump it, or add --ignore-vuln=<ID> WITH a comment stating
      # why it's safe and the fix path. Do not let the ignore list grow
      # silently. (History: starlette cluster cleared by the fastapi
      # 0.111→0.139 bump; pyasn1 cleared by migrating python-jose→PyJWT.)
      - name: pip-audit — CVE scan
        run: pip-audit --strict --requirement requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Alembic drift check (no un-migrated model changes)
        # Piping this through tee without pipefail previously hid drift failures.
        # Alembic is pinned to a version supporting check; no success fallback.
        run: python -m alembic check

      # Provision the Postgres DB for the gated tests. `appuser` is a
      # NON-superuser and RUNS the migrations, so it owns the tables — which
      # is what makes FORCE ROW LEVEL SECURITY apply to it (a superuser, or a
      # non-owner without FORCE, would bypass RLS and the isolation tests
      # would validate nothing). This mirrors production: the app connects as
      # a non-superuser owner of its schema.
      - name: Provision Postgres (non-superuser role) + migrate
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d dealsignal_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          CREATE EXTENSION IF NOT EXISTS postgis_topology;
          CREATE ROLE appuser LOGIN PASSWORD 'app';
          GRANT ALL ON SCHEMA public TO appuser;
          -- Eval RLS tests isolate their fixtures in a disposable schema.
          GRANT CREATE ON DATABASE dealsignal_test TO appuser;
          SQL
          DATABASE_URL="$TEST_POSTGRES_URL" alembic upgrade head

      - name: PostgreSQL schema drift check
        run: DATABASE_URL="$TEST_POSTGRES_URL" python -m alembic check

      - name: Provision isolated research acceptance database
        env:
          PGPASSWORD: postgres
        run: |
          run_id="$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          db_name="bs_snapshot_test_${run_id}"
          createdb -h 127.0.0.1 -U postgres -O appuser "$db_name"
          psql -h 127.0.0.1 -U postgres -d "$db_name" -v ON_ERROR_STOP=1 \
            -v db_name="$db_name" -v marker="BuildSignals disposable snapshot test:${run_id}" <<'SQL'
          COMMENT ON DATABASE :"db_name" IS :'marker';
          CREATE EXTENSION postgis;
          CREATE EXTENSION postgis_topology;
          GRANT USAGE ON SCHEMA topology TO appuser;
          GRANT SELECT ON ALL TABLES IN SCHEMA topology TO appuser;
          SQL
          research_url="postgresql+psycopg2://appuser:app@127.0.0.1:5432/${db_name}"
          PGPASSWORD= SNAPSHOT_TEST_POSTGRES_URL="$research_url" SNAPSHOT_TEST_RUN_ID="$run_id" python - <<'PY'
          import os
          from tests.snapshot_postgres_support import verified_snapshot_connection
          with verified_snapshot_connection(os.environ['SNAPSHOT_TEST_POSTGRES_URL'], os.environ['SNAPSHOT_TEST_RUN_ID']):
              pass
          PY
          DATABASE_URL="$research_url" alembic upgrade head
          echo "SNAPSHOT_TEST_POSTGRES_URL=$research_url" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TEST_RUN_ID=$run_id" >> "$GITHUB_ENV"

      # Coverage gate: floor is set below current (~88%) so it passes with
      # headroom but fails if a meaningful chunk of new code lands untested.
      # Raise the floor deliberately as coverage improves — don't chase 100%.
      # TEST_POSTGRES_URL (job env) activates the RLS + reversibility tests.
      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
