name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ENVIRONMENT: "ci"
      # RLS + migration-reversibility tests run against real Postgres, as a
      # NON-superuser role. This matters: a superuser bypasses row-level
      # security even under FORCE RLS, so RLS assertions only mean something
      # as a non-superuser — exactly how the app connects in production.
      TEST_POSTGRES_URL: "postgresql://appuser:app@localhost:5432/dealsignal_test"
      TEST_EVAL_POSTGRES_URL: "postgresql://appuser:app@localhost:5432/dealsignal_test"
      TEST_SCHEMA_RECONCILIATION_POSTGRES_URL: "postgresql://appuser:app@localhost:5432/dealsignal_test"
    services:
      postgres:
        # Nearby-parcel migrations require PostGIS (geography centroid + GIST index).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealsignal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pip-audit pytest-cov ruff

      # Lint: a focused ruleset (pyflakes + import order) — see ruff.toml.
      # Catches real bugs (undefined names, unused imports); this is how the
      # config.py use-before-definition bug was found.
      - name: Lint (ruff)
        run: ruff check app/ scripts/ tests/

      - name: Verify nationwide rollout manifest
        run: python -m app.services.ingestion.cli catalog rollout-manifest --check

      # Fails the build on any known-vulnerable dependency. Uses the PyPI
      # advisory DB (osv.dev). To skip a CVE we've reviewed and confirmed
      # doesn't affect us, add --ignore-vuln=<ID> with a comment.
      #
      # Zero suppressions. If this step fails, a dependency has a known
      # CVE — bump it, or add --ignore-vuln=<ID> WITH a comment stating
      # why it's safe and the fix path. Do not let the ignore list grow
      # silently. (History: starlette cluster cleared by the fastapi
      # 0.111→0.139 bump; pyasn1 cleared by migrating python-jose→PyJWT.)
      - name: pip-audit — CVE scan
        run: pip-audit --strict --requirement requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Alembic drift check (no un-migrated model changes)
        # Piping this through tee without pipefail previously hid drift failures.
        # Alembic is pinned to a version supporting check; no success fallback.
        run: python -m alembic check

      # Provision the Postgres DB for the gated tests. `appuser` is a
      # NON-superuser and RUNS the migrations, so it owns the tables — which
      # is what makes FORCE ROW LEVEL SECURITY apply to it (a superuser, or a
      # non-owner without FORCE, would bypass RLS and the isolation tests
      # would validate nothing). This mirrors production: the app connects as
      # a non-superuser owner of its schema.
      - name: Provision Postgres (non-superuser role) + migrate
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d dealsignal_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          CREATE EXTENSION IF NOT EXISTS postgis_topology;
          CREATE ROLE appuser LOGIN PASSWORD 'app';
          GRANT ALL ON SCHEMA public TO appuser;
          -- Eval RLS tests isolate their fixtures in a disposable schema.
          GRANT CREATE ON DATABASE dealsignal_test TO appuser;
          SQL
          DATABASE_URL="$TEST_POSTGRES_URL" alembic upgrade head

      - name: PostgreSQL schema drift check
        run: DATABASE_URL="$TEST_POSTGRES_URL" python -m alembic check

      # Coverage gate: floor is set below current (~88%) so it passes with
      # headroom but fails if a meaningful chunk of new code lands untested.
      # Raise the floor deliberately as coverage improves — don't chase 100%.
      # TEST_POSTGRES_URL (job env) activates the RLS + reversibility tests.
      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
