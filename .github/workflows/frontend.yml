name: frontend

# Frontend release gates include production and development dependency audits,
# lint, type-check, unit tests, production build, and browser policy checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "tailwind.config.ts"
      - "postcss.config.js"
      - "vercel.json"
      - "scripts/verify_browser_policy.cjs"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=moderate

      # Ordered cheapest → most expensive so a fast failure surfaces first.
      - name: Lint
        run: npm run lint

      - name: Type-check
        # vite build uses swc, which strips types WITHOUT checking them — so a
        # standalone tsc pass is the only thing that catches type errors.
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Production build
        env:
          VITE_API_BASE_URL: https://buildsignals-api.onrender.com
        run: npm run build

      - name: Install browser for policy checks
        run: npx playwright install --with-deps chromium

      - name: Verify browser policy and login
        env:
          BROWSER_POLICY_ARTIFACT_DIR: ${{ runner.temp }}/browser-policy
        run: node scripts/verify_browser_policy.cjs

      - name: Save browser policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-policy-screenshots
          path: ${{ runner.temp }}/browser-policy
          if-no-files-found: ignore
          retention-days: 7
