# Render Blueprint — STAGING
#
# Non-production stack for pre-release validation. Apply as a separate
# Render project (do NOT share Postgres/Redis with production).
#
# See docs/staging.md for setup, seeding, and data policy.

databases:
  - name: dealsignal-db-staging
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: dealsignal-redis-staging
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: dealsignal-api-staging
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: dealsignal-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealsignal-redis-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: cron
    name: dealsignal-ingestion-staging
    runtime: python
    plan: starter
    schedule: "0 7 * * *"   # 07:00 UTC daily (offset from prod)
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/daily-ingestion.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: dealsignal-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dealsignal-redis-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INGESTION_ORGANIZATION
        value: default-org
      - key: INGESTION_MAX_PAGES_PER_SOURCE
        value: "5"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: dealsignal-frontend-staging
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: staging
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
          img-src 'self' data: https:; font-src 'self' data:;
          connect-src 'self' https://*.onrender.com https://*.ingest.sentry.io https://*.sentry.io;
          frame-ancestors 'none'; base-uri 'self'; object-src 'none'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
